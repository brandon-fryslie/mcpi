[pytest]
# E2E test configuration
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    e2e: mark test as end-to-end test
    tier1: mark test as Tier 1 (no Docker required)
    tier2: mark test as Tier 2 (Docker/MCP protocol validation)
    slow: mark test as slow running

# Default options
addopts = -v --tb=short

# Timeout for slow tests
timeout = 120
